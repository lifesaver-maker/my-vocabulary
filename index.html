<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2458c6"><link rel="manifest" href="manifest.webmanifest"><title>나만의 영어 단어장</title><style>
:root{font-family:system-ui,sans-serif;color:#1e293b;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:16px}h1{font-size:24px}h2{font-size:19px}.panel{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #0001}input,button,select{font:inherit;padding:11px;border-radius:9px}input,select{width:100%;border:1px solid #cbd5e1;margin:5px 0}button{border:0;background:#2458c6;color:white;margin:4px;cursor:pointer}button.secondary{background:#e2e8f0;color:#172033}.tabs{display:flex;flex-wrap:wrap;gap:4px}.tabs button{flex:1;min-width:90px}.tabs button.active{background:#163b87}.hidden{display:none!important}.word{border-bottom:1px solid #e2e8f0;padding:12px 0}.muted{color:#64748b;font-size:14px}.prompt{text-align:center;background:#eef2ff;padding:24px;border-radius:12px;margin:14px 0}.prompt strong{font-size:25px}.actions{display:flex;flex-wrap:wrap;gap:4px}#pad{display:block;width:100%;height:230px;background:#fff;border:2px dashed #94a3b8;border-radius:12px;touch-action:none;cursor:crosshair}#feedback{font-weight:650;min-height:24px}.stat{display:inline-block;margin:8px 14px 8px 0}label{display:block;font-size:14px;margin-top:8px}button:focus-visible,input:focus-visible{outline:3px solid #93c5fd} </style></head><body><main><h1>📚 나만의 영어 단어장</h1><p class="muted">단어를 저장하고, 타이핑 또는 손글씨로 연습하세요.</p><nav class="tabs" aria-label="화면 선택"><button data-tab="manage" class="active">단어 관리</button><button data-tab="study">쓰기 학습</button><button data-tab="cards">플래시카드</button><button data-tab="stats">학습 기록</button></nav>
<section id="manage" class="panel"><h2>단어 등록</h2><form id="addForm"><label for="english">영어 단어</label><input id="english" required placeholder="achieve" autocomplete="off"><label for="korean">한국어 뜻</label><input id="korean" required placeholder="달성하다"><label for="example">영어 예문 (선택)</label><input id="example" placeholder="I can achieve my goal."><button type="submit">단어 저장</button></form><h2>내 단어 목록</h2><input id="search" placeholder="단어 또는 뜻 검색" aria-label="단어 검색"><p id="count"></p><div id="wordList"></div><div class="actions"><button id="export" class="secondary">백업 파일 저장</button><button id="importBtn" class="secondary">백업 가져오기</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div></section>
<section id="study" class="panel hidden"><h2>쓰기 학습</h2><label for="mode">학습 방식</label><select id="mode"><option value="typing">⌨️ 키보드 타이핑</option><option value="handwriting">✍️ 손글씨 쓰기</option></select><label for="scope">학습 대상</label><select id="scope"><option value="all">전체 단어</option><option value="wrong">오답 단어만</option></select><div class="prompt"><span class="muted">다음 뜻에 해당하는 영어 단어는?</span><p><strong id="meaning">단어를 먼저 등록하세요</strong></p><span id="hint" class="muted"></span></div><div id="typingArea"><label for="typed">영어 철자 입력</label><input id="typed" placeholder="영어 단어 입력" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="check">정답 확인</button></div><div id="handArea" class="hidden"><p class="muted">손가락 또는 터치펜으로 쓰세요. 정답을 보고 스스로 채점합니다.</p><canvas id="pad" aria-label="손글씨 쓰기 영역"></canvas><button id="clear" class="secondary">지우고 다시 쓰기</button><button id="reveal">정답 보기</button><div id="selfGrade" class="hidden"><button id="selfRight">맞았어요</button><button id="selfWrong" class="secondary">틀렸어요</button></div></div><p id="feedback" role="status"></p><div class="actions"><button id="speak" class="secondary">🔊 발음 듣기</button><button id="next">다음 단어 →</button></div></section>
<section id="cards" class="panel hidden"><h2>플래시카드</h2><div class="prompt"><strong id="cardText">단어를 먼저 등록하세요</strong></div><button id="cardFlip">뜻 보기 / 숨기기</button><button id="cardNext">다음 카드</button><button id="cardSpeak" class="secondary">🔊 발음</button></section>
<section id="stats" class="panel hidden"><h2>학습 기록</h2><div id="statsText"></div><h3>오답 단어</h3><div id="wrongList"></div><button id="resetStats" class="secondary">학습 기록 초기화</button></section>
<p class="muted">단어와 기록은 이 브라우저의 저장 공간에 보관됩니다. 기기 변경 전 백업하세요.</p></main><script>
'use strict';const KEY='my-vocabulary-v1',STATKEY='my-vocabulary-stats-v2';const $=id=>document.getElementById(id);function load(key,fallback){try{let v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}}let words=load(KEY,[]);if(!Array.isArray(words))words=[];words=words.filter(w=>w&&typeof w.english==='string'&&typeof w.korean==='string').map(w=>({...w,id:w.id??crypto.randomUUID()}));let stats=load(STATKEY,{attempts:0,correct:0,wrongIds:[]});if(!stats||typeof stats!=='object')stats={attempts:0,correct:0,wrongIds:[]};stats.attempts=Number(stats.attempts)||0;stats.correct=Number(stats.correct)||0;stats.wrongIds=Array.isArray(stats.wrongIds)?stats.wrongIds:[];let current=null,card=null,flipped=false,graded=false,shown=false;const save=()=>{localStorage.setItem(KEY,JSON.stringify(words));localStorage.setItem(STATKEY,JSON.stringify(stats))};function speak(t){if(!('speechSynthesis'in window)){alert('이 기기는 음성 합성을 지원하지 않습니다.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}function tab(id){document.querySelectorAll('main>section').forEach(s=>s.classList.toggle('hidden',s.id!==id));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));if(id==='study'){resizePad();if(!current)nextWord()}if(id==='cards'&&!card)nextCard();if(id==='stats')renderStats()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));function el(tag,text){let e=document.createElement(tag);e.textContent=text;return e}function renderWords(){const q=$('search').value.trim().toLowerCase();$('count').textContent=`총 ${words.length}개 단어`;const list=$('wordList');list.replaceChildren();words.filter(w=>(w.english+' '+w.korean).toLowerCase().includes(q)).forEach(w=>{let div=el('div','');div.className='word';div.append(el('strong',w.english),el('p',w.korean));if(w.example)div.append(el('small',w.example),el('br',''));let play=el('button','🔊 발음');play.onclick=()=>speak(w.english);let del=el('button','삭제');del.className='secondary';del.onclick=()=>{if(!confirm('이 단어를 삭제할까요?'))return;words=words.filter(x=>x.id!==w.id);stats.wrongIds=stats.wrongIds.filter(id=>id!==w.id);if(current?.id===w.id)current=null;if(card?.id===w.id)card=null;save();renderWords();renderStats()};div.append(play,del);list.append(div)})} $('addForm').onsubmit=e=>{e.preventDefault();const english=$('english').value.trim(),korean=$('korean').value.trim(),example=$('example').value.trim();if(!english||!korean)return;words.push({id:crypto.randomUUID(),english,korean,example});save();$('addForm').reset();renderWords();alert('단어가 저장되었습니다.')};$('search').oninput=renderWords;function pool(){return $('scope').value==='wrong'?words.filter(w=>stats.wrongIds.includes(w.id)):words}function nextWord(){let p=pool();current=p.length?p[Math.floor(Math.random()*p.length)]:null;graded=false;shown=false;$('meaning').textContent=current?current.korean:($('scope').value==='wrong'?'복습할 오답 단어가 없습니다':'단어를 먼저 등록하세요');$('hint').textContent=current?`${current.english.length}글자`:'';$('typed').value='';$('feedback').textContent='';$('selfGrade').classList.add('hidden');$('check').disabled=false;clearPad()}function record(ok){if(!current||graded)return;graded=true;stats.attempts++;if(ok){stats.correct++;stats.wrongIds=stats.wrongIds.filter(id=>id!==current.id)}else if(!stats.wrongIds.includes(current.id)){stats.wrongIds.push(current.id)}save();renderStats()}$('check').onclick=()=>{if(!current||graded)return;const typed=$('typed').value.trim();if(!typed){$('feedback').textContent='철자를 입력하세요.';return}const ok=typed.toLowerCase()===current.english.trim().toLowerCase();record(ok);$('feedback').textContent=ok?'✅ 정답입니다!':`❌ 정답: ${current.english}`;$('check').disabled=true};$('typed').addEventListener('keydown',e=>{if(e.key==='Enter')$('check').click()});$('mode').onchange=()=>{$('typingArea').classList.toggle('hidden',$('mode').value!=='typing');$('handArea').classList.toggle('hidden',$('mode').value!=='handwriting');nextWord();resizePad()};$('scope').onchange=nextWord;$('next').onclick=nextWord;$('speak').onclick=()=>current&&speak(current.english);$('reveal').onclick=()=>{if(!current)return;shown=true;$('feedback').textContent=`정답: ${current.english}`;if(!graded)$('selfGrade').classList.remove('hidden')};$('selfRight').onclick=()=>{if(!shown||graded)return;record(true);$('feedback').textContent=`✅ 스스로 맞았다고 평가했습니다. 정답: ${current.english}`;$('selfGrade').classList.add('hidden')};$('selfWrong').onclick=()=>{if(!shown||graded)return;record(false);$('feedback').textContent=`🔁 오답으로 기록했습니다. 정답: ${current.english}`;$('selfGrade').classList.add('hidden')};function nextCard(){card=words.length?words[Math.floor(Math.random()*words.length)]:null;flipped=false;renderCard()}function renderCard(){$('cardText').textContent=card?(flipped?`${card.english} — ${card.korean}`:card.english):'단어를 먼저 등록하세요'}$('cardNext').onclick=nextCard;$('cardFlip').onclick=()=>{flipped=!flipped;renderCard()};$('cardSpeak').onclick=()=>card&&speak(card.english);function renderStats(){$('statsText').replaceChildren(el('p',`총 ${stats.attempts}회 채점 · 정답 ${stats.correct}회 · 정답률 ${stats.attempts?Math.round(stats.correct/stats.attempts*100):0}%`));const l=$('wrongList');l.replaceChildren();let wrong=words.filter(w=>stats.wrongIds.includes(w.id));if(!wrong.length)l.append(el('p','현재 오답 단어가 없습니다.'));wrong.forEach(w=>l.append(el('p',`${w.english} — ${w.korean}`)))}$('resetStats').onclick=()=>{if(!confirm('학습 기록과 오답 목록을 초기화할까요?'))return;stats={attempts:0,correct:0,wrongIds:[]};save();renderStats()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:2,words,stats},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-vocabulary-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.words)||!data.words.every(w=>w&&typeof w.english==='string'&&typeof w.korean==='string'))throw Error('파일 형식이 올바르지 않습니다.');if(!confirm('현재 단어와 학습 기록을 백업 내용으로 교체할까요?'))return;words=data.words.map(w=>({id:w.id??crypto.randomUUID(),english:w.english,korean:w.korean,example:typeof w.example==='string'?w.example:''}));stats=data.stats&&typeof data.stats==='object'?{attempts:Number(data.stats.attempts)||0,correct:Number(data.stats.correct)||0,wrongIds:Array.isArray(data.stats.wrongIds)?data.stats.wrongIds:[]}:{attempts:0,correct:0,wrongIds:[]};current=null;card=null;save();renderWords();renderStats();alert('가져오기가 완료되었습니다.')}catch(err){alert('가져오기 실패: '+err.message)}finally{e.target.value=''}};
const canvas=$('pad'),ctx=canvas.getContext('2d');let drawing=false;function resizePad(){let r=canvas.getBoundingClientRect();if(r.width<1)return;const dpr=window.devicePixelRatio||1;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(230*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.strokeStyle='#172d52';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round'}function clearPad(){ctx.clearRect(0,0,canvas.width,canvas.height)}function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke()};canvas.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()};canvas.onpointerup=canvas.onpointercancel=()=>{drawing=false;ctx.beginPath()};$('clear').onclick=clearPad;window.addEventListener('resize',()=>{if(!$('handArea').classList.contains('hidden'))resizePad()});renderWords();renderStats();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
